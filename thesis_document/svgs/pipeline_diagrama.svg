<svg width="1720" height="500" viewBox="0 0 1720 500" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9Z" fill="#5F5E5A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1720" height="500" fill="#FFFFFF"/>

  <!-- connectors -->
  <g stroke="#5F5E5A" stroke-width="1.5" fill="none">
    <path d="M170,290 L190,290 L190,100 L208,100" marker-end="url(#arrow)"/>
    <path d="M170,310 L190,310 L190,430 L208,430" marker-end="url(#arrow)"/>

    <line x1="400" y1="100" x2="438" y2="95" marker-end="url(#arrow)"/>
    <line x1="525" y1="125" x2="525" y2="143" marker-end="url(#arrow)"/>
    <line x1="525" y1="205" x2="525" y2="223" marker-end="url(#arrow)"/>
    <line x1="525" y1="305" x2="525" y2="287" marker-end="url(#arrow)"/>

    <path d="M612,240 L630,240 L630,175 L648,175" marker-end="url(#arrow)"/>
    <line x1="612" y1="255" x2="648" y2="255" marker-end="url(#arrow)"/>

    <line x1="802" y1="175" x2="838" y2="175" marker-end="url(#arrow)"/>
    <line x1="802" y1="255" x2="838" y2="255" marker-end="url(#arrow)"/>

    <path d="M992,175 L1010,175 L1010,205 L1028,205" marker-end="url(#arrow)"/>
    <path d="M992,255 L1010,255 L1010,235 L1028,235" marker-end="url(#arrow)"/>

    <line x1="390" y1="430" x2="1028" y2="430" marker-end="url(#arrow)"/>

    <path d="M1230,215 L1250,215 L1250,300 L1258,300" marker-end="url(#arrow)"/>
    <path d="M1120,460 L1120,480 L1250,480 L1250,350 L1258,350" marker-end="url(#arrow)"/>

    <line x1="1462" y1="325" x2="1498" y2="325" marker-end="url(#arrow)"/>
  </g>

  <!-- Firm-period data (gray) -->
  <g>
    <rect x="20" y="270" width="150" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
    <text x="95" y="304" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Firm-period data</text>
  </g>

  <!-- Text data (teal) -->
  <g>
    <rect x="210" y="65" width="190" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
    <text x="305" y="95" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C">Text data (Edgar)</text>
    <text x="305" y="115" text-anchor="middle" font-size="12" fill="#0F6E56">10-K, 10-Q, 8-K, DEF14A, calls</text>
  </g>

  <!-- Numeric data (gray) -->
  <g>
    <rect x="210" y="400" width="180" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
    <text x="300" y="425" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Numeric data</text>
    <text x="300" y="444" text-anchor="middle" font-size="12" fill="#5F5E5A">XBRL, prices</text>
  </g>

  <!-- Text processing stack (green) -->
  <g>
    <rect x="440" y="65" width="170" height="60" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.75"/>
    <text x="525" y="99" text-anchor="middle" font-size="13" font-weight="600" fill="#173404">Cleaning and prefiltering</text>
  </g>
  <g>
    <rect x="440" y="145" width="170" height="60" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.75"/>
    <text x="525" y="169" text-anchor="middle" font-size="13" font-weight="600" fill="#173404">Embeddings and lexical</text>
    <text x="525" y="187" text-anchor="middle" font-size="11" fill="#3B6D11">Text embeddings + signals</text>
  </g>
  <g>
    <rect x="440" y="225" width="170" height="60" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.75"/>
    <text x="525" y="259" text-anchor="middle" font-size="13" font-weight="600" fill="#173404">AI paragraph classifier</text>
  </g>

  <!-- Golden sets (coral) -->
  <g>
    <rect x="440" y="305" width="170" height="50" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.75"/>
    <text x="525" y="325" text-anchor="middle" font-size="13" font-weight="600" fill="#4A1B0C">Golden sets</text>
    <text x="525" y="342" text-anchor="middle" font-size="11" fill="#993C1D">+ training</text>
  </g>

  <!-- Disclosure / Extractor passes (green) -->
  <g>
    <rect x="650" y="145" width="150" height="60" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.75"/>
    <text x="725" y="169" text-anchor="middle" font-size="13" font-weight="600" fill="#173404">Disclosure</text>
    <text x="725" y="187" text-anchor="middle" font-size="11" fill="#3B6D11">LLM pass</text>
  </g>
  <g>
    <rect x="650" y="225" width="150" height="60" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.75"/>
    <text x="725" y="249" text-anchor="middle" font-size="13" font-weight="600" fill="#173404">Extractor</text>
    <text x="725" y="267" text-anchor="middle" font-size="11" fill="#3B6D11">LLM pass</text>
  </g>

  <!-- Frames (blue) -->
  <g>
    <rect x="840" y="145" width="150" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
    <text x="915" y="169" text-anchor="middle" font-size="13" font-weight="600" fill="#042C53">Semantic</text>
    <text x="915" y="187" text-anchor="middle" font-size="11" fill="#185FA5">frames</text>
  </g>
  <g>
    <rect x="840" y="225" width="150" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
    <text x="915" y="249" text-anchor="middle" font-size="13" font-weight="600" fill="#042C53">Activity</text>
    <text x="915" y="267" text-anchor="middle" font-size="11" fill="#185FA5">frames</text>
  </g>

  <!-- Processed qualitative data (blue) -->
  <g>
    <rect x="1030" y="180" width="200" height="70" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
    <text x="1130" y="220" text-anchor="middle" font-size="14" font-weight="600" fill="#042C53">Processed qualitative data</text>
  </g>

  <!-- Processed quantitative data (blue) -->
  <g>
    <rect x="1030" y="400" width="200" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
    <text x="1130" y="435" text-anchor="middle" font-size="14" font-weight="600" fill="#042C53">Processed quantitative data</text>
  </g>

  <!-- Point-in-time fusion (purple) -->
  <g>
    <rect x="1260" y="290" width="200" height="70" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
    <text x="1360" y="318" text-anchor="middle" font-size="13" font-weight="600" fill="#26215C">Point-in-time fusion</text>
    <text x="1360" y="336" text-anchor="middle" font-size="11" fill="#534AB7">and aggregation</text>
  </g>

  <!-- Analyses and visualizations (purple) -->
  <g>
    <rect x="1500" y="295" width="180" height="60" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
    <text x="1590" y="330" text-anchor="middle" font-size="13" font-weight="600" fill="#26215C">Analyses and visualizations</text>
  </g>
</svg>
