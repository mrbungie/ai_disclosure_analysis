<svg width="1740" height="510" viewBox="0 0 1740 510" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9Z" fill="#5F5E5A"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9Z" fill="#3B6D11"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1740" height="510" fill="#FFFFFF"/>

  <!-- CONNECTORS -->
  <g stroke="#5F5E5A" stroke-width="1.5" fill="none">
    <!-- 3-WAY PARALLEL SPLIT FROM S&P 500 UNIVERSE -->
    <path d="M155,230 L170,230 L170,90 L183,90" marker-end="url(#arrow)"/>
    <path d="M155,245 L170,245 L170,388 L183,388" marker-end="url(#arrow)"/>
    <path d="M155,260 L170,260 L170,465 L183,465" marker-end="url(#arrow)"/>

    <!-- Text Data to Cleaning -->
    <line x1="370" y1="90" x2="438" y2="90" marker-end="url(#arrow)"/>

    <!-- Text Processing Stack Vertical Arrows -->
    <line x1="525" y1="120" x2="525" y2="138" marker-end="url(#arrow)"/>
    <line x1="525" y1="198" x2="525" y2="216" marker-end="url(#arrow)"/>
    <line x1="525" y1="298" x2="525" y2="280" marker-end="url(#arrow)"/>

    <!-- GBDT Gate to Pass 1 -->
    <path d="M610,245 L625,245 L625,100 L638,100" marker-end="url(#arrow)"/>

    <!-- Pass 1 to Semantic Frames -->
    <line x1="815" y1="100" x2="843" y2="100" marker-end="url(#arrow)"/>

    <!-- Pass 2 to Disclosed Activities -->
    <line x1="815" y1="220" x2="843" y2="220" marker-end="url(#arrow)"/>

    <!-- Disclosed Activities to Grounding and Geo Taxonomy -->
    <path d="M1020,210 L1035,210 L1035,188 L1048,188" marker-end="url(#arrow)"/>
    <path d="M1020,230 L1035,230 L1035,258 L1048,258" marker-end="url(#arrow)"/>

    <!-- Parallel Quantitative Streams into Processed Panel -->
    <line x1="370" y1="388" x2="438" y2="398" marker-end="url(#arrow)"/>
    <line x1="370" y1="465" x2="438" y2="442" marker-end="url(#arrow)"/>

    <!-- Inputs to Fusion -->
    <!-- From Semantic Frames (D, P) -->
    <path d="M1020,100 L1250,100 L1250,220 L1273,220" marker-end="url(#arrow)"/>
    <!-- From Grounding (G, S) -->
    <path d="M1230,188 L1250,188 L1250,240 L1273,240" marker-end="url(#arrow)"/>
    <!-- From Geo Taxonomy -->
    <path d="M1230,258 L1250,258 L1250,260 L1273,260" marker-end="url(#arrow)"/>
    <!-- From Processed Quantitative Data -->
    <path d="M1010,420 L1250,420 L1250,280 L1273,280" marker-end="url(#arrow)"/>

    <!-- Fusion to Empirical Analyses -->
    <line x1="1470" y1="250" x2="1508" y2="250" marker-end="url(#arrow)"/>
  </g>

  <!-- SEQUENTIAL Pass 1 to Pass 2 Connector (Green & highlighted) -->
  <g stroke="#3B6D11" stroke-width="2.0" fill="none">
    <line x1="727" y1="130" x2="727" y2="188" marker-end="url(#arrow-green)"/>
  </g>
  <text x="734" y="163" font-size="10" fill="#2E580E" font-weight="600" font-style="italic">behavioral subset (~17.4k)</text>

  <!-- 1. UNIVERSE (Gray) -->
  <g>
    <rect x="20" y="215" width="135" height="65" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
    <text x="87" y="242" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C2C2A">S&amp;P 500 Universe</text>
    <text x="87" y="260" text-anchor="middle" font-size="11" fill="#5F5E5A">2021–2026 (~60k docs)</text>
  </g>

  <!-- 2. TEXT DATA (Teal) -->
  <g>
    <rect x="185" y="55" width="185" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.75"/>
    <text x="277" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#04342C">Text Data (Edgar &amp; Calls)</text>
    <text x="277" y="98" text-anchor="middle" font-size="11" fill="#0F6E56">10-K, 10-Q, 8-K, DEF 14A</text>
    <text x="277" y="114" text-anchor="middle" font-size="11" fill="#0F6E56">Earnings calls, SEC letters</text>
  </g>

  <!-- 3. FINANCIAL & MARKET DATA (Gray, Parallel Stream 2) -->
  <g>
    <rect x="185" y="355" width="185" height="65" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
    <text x="277" y="380" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C2C2A">Financial &amp; Market Data</text>
    <text x="277" y="398" text-anchor="middle" font-size="11" fill="#5F5E5A">XBRL fundamentals (capex, R&amp;D)</text>
    <text x="277" y="413" text-anchor="middle" font-size="11" fill="#5F5E5A">Daily stock prices, Beta, IVol</text>
  </g>

  <!-- 4. PATENTS DATA (Gray, Parallel Stream 3) -->
  <g>
    <rect x="185" y="435" width="185" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.75"/>
    <text x="277" y="458" text-anchor="middle" font-size="13" font-weight="bold" fill="#2C2C2A">AI Patents (OECD 2025)</text>
    <text x="277" y="475" text-anchor="middle" font-size="11" fill="#5F5E5A">Google Patents / BigQuery</text>
    <text x="277" y="489" text-anchor="middle" font-size="10" fill="#5F5E5A">5 core CPCs + 274 keywords</text>
  </g>

  <!-- 5. PREPROCESSING STACK (Green) -->
  <g>
    <rect x="440" y="60" width="170" height="60" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.75"/>
    <text x="525" y="85" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#173404">Cleaning &amp; Deduplication</text>
    <text x="525" y="103" text-anchor="middle" font-size="11" fill="#3B6D11">BLAKE2b hash (8.9M → 5.1M)</text>
  </g>
  <g>
    <rect x="440" y="138" width="170" height="60" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.75"/>
    <text x="525" y="163" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#173404">Feature Extraction</text>
    <text x="525" y="181" text-anchor="middle" font-size="11" fill="#3B6D11">39 signals + BGE-M3 embeddings</text>
  </g>
  <g>
    <rect x="440" y="216" width="170" height="60" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.75"/>
    <text x="525" y="241" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#173404">Supervised GBDT Gate</text>
    <text x="525" y="259" text-anchor="middle" font-size="11" fill="#3B6D11">Recall ≥ 0.92 (36,613 flagged)</text>
  </g>
  <!-- Golden sets (Coral) -->
  <g>
    <rect x="440" y="298" width="170" height="48" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.75"/>
    <text x="525" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#4A1B0C">Golden Sets &amp; Benchmarks</text>
    <text x="525" y="335" text-anchor="middle" font-size="10.5" fill="#993C1D">n=9,900 train; κ=0.81–0.87 audit</text>
  </g>

  <!-- 6. LLM EXTRACTION PASSES (Green) -->
  <!-- Pass 1 -->
  <g>
    <rect x="640" y="70" width="175" height="60" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.75"/>
    <text x="727" y="95" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#173404">Pass 1: Semantic Claims</text>
    <text x="727" y="113" text-anchor="middle" font-size="11" fill="#3B6D11">Zero-shot LLM (8 core fields)</text>
  </g>
  <!-- Pass 2 -->
  <g>
    <rect x="640" y="190" width="175" height="60" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.75"/>
    <text x="727" y="215" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#173404">Pass 2: Activity Triples</text>
    <text x="727" y="233" text-anchor="middle" font-size="11" fill="#3B6D11">Firm-conditioned LLM extraction</text>
  </g>

  <!-- 7. STRUCTURED QUALITATIVE OUTPUTS & ENRICHMENTS (Blue) -->
  <!-- Semantic frames (D, P) -->
  <g>
    <rect x="845" y="70" width="175" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
    <text x="932" y="95" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#042C53">Semantic Frames</text>
    <text x="932" y="113" text-anchor="middle" font-size="11" fill="#185FA5">69,704 frames → D, P Posture</text>
  </g>
  <!-- Disclosed activities (A) -->
  <g>
    <rect x="845" y="190" width="175" height="60" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
    <text x="932" y="215" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#042C53">Disclosed Activities</text>
    <text x="932" y="233" text-anchor="middle" font-size="11" fill="#185FA5">47,683 operational triples (A)</text>
  </g>
  <!-- Grounding (G, S) -->
  <g>
    <rect x="1050" y="160" width="180" height="55" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
    <text x="1140" y="183" text-anchor="middle" font-size="12" font-weight="bold" fill="#042C53">Grounding &amp; Substance</text>
    <text x="1140" y="201" text-anchor="middle" font-size="10.5" fill="#185FA5">5 falsification flags → G, S</text>
  </g>
  <!-- Geographic Taxonomy -->
  <g>
    <rect x="1050" y="230" width="180" height="55" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
    <text x="1140" y="253" text-anchor="middle" font-size="12" font-weight="bold" fill="#042C53">Geographic Taxonomy</text>
    <text x="1140" y="271" text-anchor="middle" font-size="10.5" fill="#185FA5">Ecosystem lexicon (US, EU, CN)</text>
  </g>

  <!-- 8. PROCESSED QUANTITATIVE PANEL (Blue) -->
  <g>
    <rect x="440" y="375" width="570" height="95" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.75"/>
    <text x="725" y="400" text-anchor="middle" font-size="13" font-weight="bold" fill="#042C53">Processed Quantitative Panel (Firm-Year)</text>
    <text x="725" y="420" text-anchor="middle" font-size="11" fill="#185FA5">• Financial Fundamentals: capex, R&amp;D-to-sales, gross/operating margins, asset turnover (XBRL)</text>
    <text x="725" y="438" text-anchor="middle" font-size="11" fill="#185FA5">• Capital Market Risk: 252-day market beta, idiosyncratic volatility (ivol)</text>
    <text x="725" y="456" text-anchor="middle" font-size="11" fill="#185FA5">• External Tech Capability: OECD AI patent grants &amp; patent intensity (Google Patents / BigQuery)</text>
  </g>

  <!-- 9. MULTI-SOURCE FUSION (Purple) -->
  <g>
    <rect x="1275" y="195" width="195" height="110" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
    <text x="1372" y="223" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#26215C">Point-in-Time Fusion</text>
    <text x="1372" y="242" text-anchor="middle" font-size="11" fill="#534AB7">Construct operationalization:</text>
    <text x="1372" y="261" text-anchor="middle" font-size="12" font-weight="bold" fill="#26215C">D, P, A, G, S, W (Decoupling)</text>
    <text x="1372" y="280" text-anchor="middle" font-size="10" fill="#534AB7">Firm-year, call &amp; venue panels</text>
  </g>

  <!-- 10. EMPIRICAL ANALYSES & CHAPTERS (Purple) -->
  <g>
    <rect x="1510" y="190" width="195" height="120" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.75"/>
    <text x="1607" y="217" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#26215C">Empirical Analyses</text>
    <text x="1607" y="238" text-anchor="middle" font-size="10.5" fill="#26215C">Ch 3: AI Archetypes (D, P)</text>
    <text x="1607" y="255" text-anchor="middle" font-size="10.5" fill="#26215C">Ch 4: Operations &amp; Geo (A, G)</text>
    <text x="1607" y="272" text-anchor="middle" font-size="10.5" fill="#26215C">Ch 5: Credibility &amp; Decoupling (W)</text>
    <text x="1607" y="289" text-anchor="middle" font-size="10.5" fill="#26215C">Ch 6–7: Markets &amp; Diligence</text>
  </g>
</svg>
