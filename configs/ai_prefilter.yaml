# Anchors and lexical terms for the AI paragraph prefilter.
#
# Both halves of the prefilter are configured here so tuning it never means
# editing Python. Changing anything in this file changes the content hash that
# identifies a scoring run, so scores computed under an older version are
# reported and skipped rather than silently unioned with new ones — and because
# embedding is a separate pass (scripts/common/ai_embed.py), re-scoring the
# whole corpus after a change here costs ~30 seconds, not a re-embed.
#
# HOW TO WRITE AN ANCHOR
# Anchors are matched against paragraphs by cosine similarity, so an anchor has
# to READ LIKE THE PARAGRAPHS it should retrieve: a sentence of filing prose
# that contains the concept, not a description of the concept.
#
# This matters more than it sounds. An earlier version used category
# descriptions ("The company relies on third-party artificial intelligence
# providers or models."), and its nearest neighbours in the real corpus were
# generic supplier-dependence boilerplate — "We are dependent on third-party
# suppliers." scored 0.795, HIGHER than actual AI risk-factor disclosure. The
# model was matching the sentence's dominant clause ("relies on third-party
# providers"), because that is what the anchor was mostly about. Written as
# disclosure prose instead, the anchor's dominant clause is the AI itself.

lexical:
  # Se matchean con LÍMITE DE PALABRA sobre el texto en minúsculas, no como
  # subcadena suelta. El límite es lo que hace el trabajo: sin él, "ai" matchea
  # "said", "certain", "chair" y "remain". Con él, no hace falta distinguir
  # mayúsculas — medido sobre el corpus, `AI` sensible a mayúsculas da 11.963
  # párrafos y `ai` insensible da 11.992: 29 de diferencia en 3 millones.
  #
  # Dos categorías de término, con roles distintos:
  #
  # `concepts` — vocabulario GENÉRICO de IA (ai, ml, llm, machine learning...).
  # Las siglas importan más que los términos largos: antes de incluirlas, la
  # lista capturaba 8.347 párrafos; con ellas, 16.608 (Microsoft escribe "AI"
  # y casi nunca "artificial intelligence": 409 párrafos sobre IA, la lista
  # sin siglas atrapaba solo 56, el 14%). `strong` nombra la IA directamente;
  # `weak` es ambiguo por sí solo ("model" cae en cada párrafo de valuación
  # del corpus) y se conserva como señal aparte.
  #
  # `entities` — marcas de PRODUCTO de IA específicas (nunca la empresa matriz/
  # conglomerado que las publica: verificado en el corpus real que "baidu" y
  # "huawei" aparecen mayormente en contexto NO relacionado con IA —
  # registradores de dominio, proveedores de GPU/telecom genéricos— mientras
  # que "deepseek" aparece SIEMPRE en contexto de IA, listado junto a ChatGPT/
  # Anthropic/Gemini/Llama). Todas cuentan como señal `strong` al aplanarse
  # (ver ai_prefilter_anchors.py::strong_terms) — un nombre de producto
  # inequívoco nunca es ambiguo del modo en que "model" o "automation" sí lo
  # son. Estructuradas geografía -> modalidad -> [términos] (2026-09-04,
  # a pedido explícito: preservar PROVENANCE, no solo la lista plana) para
  # que la jerarquía misma sea la metadata — sin repetir geo/modalidad por
  # término. El prefiltro hoy solo consume la lista aplanada (no hay
  # "leaning" geográfico ni por modalidad calculado todavía; ver
  # ai_prefilter_anchors.py::entity_terms para la versión con metadata, lista
  # para cuando se necesite sin tener que rehacer esta estructura).
  concepts:
    strong:
      - ai
      - ml
      - llm
      - llms
      - agi
      - nlp
      - gen ai
      - artificial intelligence
      - generative ai
      - genai
      - machine learning
      - deep learning
      - large language model
      - large language models
      - foundation model
      - foundation models
      - neural network
      - neural networks
    weak:
      - algorithm
      - predictive
      - prediction
      - recommendation
      - classifier
      - automation
      - automated decision
      - computer vision
      - natural language processing
      - model
      - adas
      - rpa

  entities:
    usa:
      text:
        - chatgpt
        - openai
        - gpt-4
        - claude
        - gemini
        - copilot
        - anthropic
        - meta ai
        - llama 2
        - llama 3
        - vertex ai
        - azure openai
        - watsonx
        - hugging face
        - huggingface
        - grok
      image:
        - midjourney
        - dall-e
        - dalle-2
        - dalle-3
        - ideogram
      video:
        # "sora", "runway", "pika" y "gen-3/gen-4" quedaron AFUERA (probados
        # y descartados 2026-09-04): "SORA" es una tasa de referencia de
        # Singapur ("Singapore Overnight Rate Average") y también el nombre
        # de una adquisición de ADP sin relación con OpenAI; "runway" es
        # jerga de negocios/aviación común (67 párrafos, ninguno sobre
        # Runway ML); "pika" es "Pika Energy", una empresa real de energía
        # sin relación con Pika Labs. "veo" (Google) sí se verificó correcto
        # (1/1 mención real de IA) y queda.
        - veo
        - dream machine
      audio:
        - elevenlabs
        - suno
        - udio
      coding:
        # "devin" quedó AFUERA (probado y descartado 2026-09-04): coincide
        # con "Devin W. Stockfish", CEO real de Weyerhaeuser, en cada firma
        # de 10-K de esa empresa -- falso positivo garantizado. "cursor" y
        # "windsurf" sí se verificaron correctos (matches reales listados
        # junto a Copilot/Anthropic/OpenAI), aunque "cursor" en particular
        # sigue siendo una palabra común de UI -- vale la pena revisar de
        # nuevo si empieza a aparecer en contextos no relacionados con IA.
        - github copilot
        - cursor
        - windsurf
        - codeium
      other:
        - deepmind
        - character.ai
        - perplexity ai
    china:
      text:
        - deepseek
        - qwen
        - tongyi qianwen
        - ernie bot
        - wenxin yiyan
        - chatglm
        - glm-4
        - hunyuan
        - kimi
        - moonshot ai
        - doubao
        - baichuan
      video:
        - kling
        - kling ai
        - seedance
      three_d:
        - hunyuan3d
    europe:
      text:
        - mistral ai
        - mixtral
        - le chat
        - aleph alpha
        - pharia
      image:
        - stability ai
        - stable diffusion
        # "flux" (Black Forest Labs) quedó AFUERA (probado y descartado
        # 2026-09-04): es una palabra inglesa genérica de uso técnico común
        # (93 párrafos, ninguno sobre el modelo FLUX) -- demasiado ambigua
        # para incluir sin calificador, y "flux ai" / "black forest labs" no
        # aparecen todavía en el corpus como para justificar la forma larga.
    other:
      text:
        - cohere
        - ai21 labs
        - hyperclova
      three_d:
        - meshy
        - meshy ai
        - tripo

semantic:
  # CÓMO ESCRIBIR UN ANCHOR
  # El anchor tiene que ser LENGUAJE DE IA, no una oración de filing que
  # mencione IA. La similitud coseno se queda con la parte dominante de la
  # oración, así que todo el andamiaje corporativo que le agregues ("our board
  # of directors, through its audit and risk committees...") es lo que va a
  # recuperar.
  #
  # Dos versiones anteriores fallaron por esto y vale la pena tenerlas
  # presentes:
  #  1) Descripciones de categoría ("The company relies on third-party
  #     artificial intelligence providers") -> recuperaba boilerplate de
  #     dependencia de proveedores; "We are dependent on third-party suppliers"
  #     quedaba en el puesto 12 del corpus.
  #  2) Prosa de filing realista ("Our board of directors, through its audit and
  #     risk committees, oversees the risks associated with our use of
  #     artificial intelligence") -> peor todavía: los 147.783 párrafos sin
  #     match léxico y margen alto eran encabezados de sección, boilerplate de
  #     comités y párrafos de ingresos. Ninguno mencionaba IA.
  #
  # La regla: si tapás las palabras de IA del anchor y lo que queda todavía
  # describe medio corpus, el anchor está mal.
  positive:
    ai_use:
      - artificial intelligence and machine learning deployed in production, AI
        models running in our products, generative AI features used by customers
      - we use AI to automate workflows, machine learning powers our decisioning,
        AI-driven automation of internal processes
    ai_exploration:
      - piloting generative AI, evaluating large language models, early-stage AI
        experiments and proofs of concept, testing AI use cases
      - exploring artificial intelligence applications, assessing where machine
        learning could be applied, AI still in trial and not yet deployed
    ai_capability:
      - proprietary AI models trained in-house, our own machine learning
        platform, foundation models we develop, AI research and engineering teams
      - large language models licensed from AI providers, third-party AI model
        vendors, dependence on external foundation model providers
      - AI infrastructure investment, GPU and accelerated computing capacity for
        machine learning, training data and AI talent
    ai_outcome:
      - productivity gains from artificial intelligence, cost savings delivered
        by machine learning, efficiency improvements attributed to AI automation
      - revenue growth driven by AI products, AI monetization and adoption,
        customer engagement improved by machine learning personalization
    ai_risk:
      - artificial intelligence cybersecurity risk, AI-enabled attacks, misuse of
        personal data by AI systems, model and training data breaches
      - AI regulation and compliance, artificial intelligence law, algorithmic
        accountability requirements, AI copyright and intellectual property
        disputes
      - AI hallucination and inaccurate model output, algorithmic bias,
        unreliable machine learning predictions, harmful AI-generated content
      - competitive disruption from artificial intelligence, AI displacing our
        workforce, rivals deploying machine learning faster
    ai_governance:
      - artificial intelligence governance framework, responsible AI policy, AI
        ethics standards, human-in-the-loop review of AI systems, AI model risk
        management
      - AI acceptable use standards, oversight of artificial intelligence
        deployment, controls and monitoring over machine learning models
    ai_strategy:
      - artificial intelligence is central to our strategy, AI-first company,
        transformative potential of generative AI for our industry
      - betting on artificial intelligence, AI as our key competitive
        differentiator, machine learning at the core of our long-term plan

  # Los negativos son la GEMELA SIN IA de cada positivo: el mismo andamiaje,
  # ninguna palabra de IA. Así el margen positivo-negativo mide cuánto de la
  # similitud viene de la IA y no del contexto corporativo. Los cinco genéricos
  # anteriores no cubrían governance, risk ni outcome, que son justo donde el
  # andamiaje domina.
  negative:
    - our board of directors and its audit and risk committees oversee risk
      management, management reports periodically to the committees
    - risks related to intellectual property, litigation, and regulatory
      compliance
    - net revenue increased due to higher average selling prices, partially
      offset by lower unit volumes and unfavorable currency
    - our technology offerings, digital platforms and enabling technologies for
      customers, product and service capabilities
    - policies, internal controls, standards and oversight procedures over our
      operations
    - we are dependent on third-party suppliers, vendors and service providers
      for components and services
    - investments in talent, infrastructure and computing capacity for our
      operations
    - our business model generates recurring revenue, valuation models and
      discounted cash flow analysis, economic forecasts of future demand
    - competitive pressure from rivals, changing customer preferences and
      technological change in our industry
    - cybersecurity incidents, data privacy breaches and information technology
      system failures
