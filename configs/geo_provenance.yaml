# Geographic Taxonomy of AI-Related Regional References
# Maps regional vocabulary (named technology entities -- foundation models,
# hyperscalers, chipmakers, software platforms, research labs, enterprise
# partners -- plus literal country/demonym terms) to geographic ecosystems.
#
# `build_geo_provenance.py` matches every term below (substring, case-
# insensitive) against paragraphs that already carry an AI disclosure frame
# (`gold_ai_frames.has_frame`), so a match always sits inside AI-context text,
# never a generic risk-factor or supply-chain paragraph that happens to name
# a country. The scan counts ANY such lexical mention -- entity names and
# country/demonym literals alike -- with no role or role-based filter.
#
# United States is the one asymmetric case: it lists company/product names
# only, never literal country terms ("united states", "u.s.", "america").
# Every U.S.-domiciled SEC filer routinely names its own jurisdiction, so a
# literal-country match there would saturate the United States share near
# 100% and erase the measure's ability to discriminate. Company/product-name
# matching keeps the United States share informative on the same basis as
# every other region.
#
# generic_exclusions below lists generic AI/technology vocabulary that must
# never be attributed to a region on its own (e.g. "cloud", "llm").

generic_exclusions:
  - "generative ai"
  - "genai"
  - "gen ai"
  - "gpus"
  - "gpu"
  - "tpus"
  - "large language models"
  - "llms"
