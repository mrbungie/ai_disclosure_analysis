cmf:
  mcp_endpoint: https://cmf-mcp.kumocloud.cl/mcp
  # Same catalog the hosted MCP server itself uses to resolve tickers to
  # RUTs (see scripts/cl/cmf_mcp_client.py's docstring for why we go
  # through the hosted server rather than CMF's site directly).
  catalog_csv: https://raw.githubusercontent.com/JoaquinMulet/empresas-cmf-chile/master/empresas_chile.csv
corpus:
  snapshot_date: '2026-09-02'
  filings:
    # annual (Memoria Anual) + quarterly (Análisis Razonado, cortes
    # 03/06/09/12) — see docs/international_expansion_plan.md's
    # instrument mapping. Both fetched by the same script (scripts/cl/
    # 01_fetch_filings.py), unlike US where 10-K/10-Q are two separate
    # instruments/scripts — CMF's filing calendar doesn't split them into
    # different regulatory forms the way SEC does.
    filing_date:
      from: '2021-01-01'
      to: '2025-12-31'
# PDF text extraction. `backend` picks which engine scripts/cl/
# 02_extract_text.py runs (see scripts/common/pdf/backends/ and the
# measured comparison in docs/analytics/pdf-backend-poc.md):
#   pymupdf — text-layer heuristics. ~2 ms/page, CPU, parallel across
#             processes. Blind to pages with no text layer, and measurably
#             lossy on tables and multi-column pages.
#   paddleocr_vl — PaddleOCR-VL 1.6. Reads pixels, returns typed blocks,
#             and ships its own furniture policy. The POC's winner: same
#             table-cell recall as the others, no chrome leakage, ~2x
#             faster (5.95 s/page steady state on this GPU).
#   mineru  — MinerU2.5-Pro VLM. Same corpus quality, half the speed.
#   dots    — dots.mocr VLM. Richer table markup, but no block type for
#             gutter/margin notes, which this corpus has on every page.
# `triage` sends only the pages that need it to the VLM and lets the CPU
# backend keep the rest — without it, a full-corpus VLM run is ~300k pages.
pdf:
  backend: paddleocr_vl
  fallback_backend: pymupdf
  triage:
    enabled: true
    min_text_chars: 40
    vlm_if_tables: true
    vlm_if_multi_column: true
  dpi: 200
  # transformers/local runs anywhere; vllm needs the model served (for
  # paddleocr_vl: `paddleocr genai_server`, then set server_url) and is the
  # only path with a tolerable corpus-scale wall clock — a single stream is
  # ~350 h for the Chilean corpus even with triage on. See the POC doc's
  # throughput section.
  runtime: transformers
  server_url: ''
storage:
  # Suffixed, not nested under a cl/ subfolder — matches the existing
  # _10q suffix convention (filing_manifest_10q.parquet) rather than
  # introducing a second layout style; see build_duckdb.py's
  # _country_configs() docstring on why these must never collide with
  # another country's paths.
  raw_documents: data/raw/filings_pdf_cl
  raw_xbrl: data/raw/xbrl_cl
  interim_manifests: data/interim/manifests_cl
  interim_sections: data/interim/sections_cl
