# AI vendor ecosystems: named providers, platforms and models
#
# Maps concrete commercial names -- companies, cloud platforms, accelerators,
# model families and enterprise AI products -- to (family, ecosystem, type).
# `ai_vendor_mentions.py` matches every term below with word-boundary regex
# against AI-relevant paragraph text; `build_ai_vendors.py` turns the matches
# into gold document-grain presence variables.
#
# The measure names WHO is mentioned, not WHERE the text says something is.
# Country and demonym words ("china", "chinese", "europe", "american") are
# deliberately absent: a geographic word is a market or regulatory reference,
# not evidence that an ecosystem's technology is present in the disclosure.
# Nothing here is matched on a country literal.
#
# This is a candidate base, not a claim that every name occurs in the corpus.
# A term nobody mentions simply scores zero.
#
# Fields per family
#   family     the provider or model family the terms name (one per company
#              group; aliases and product names collapse into it)
#   ecosystem  United States | China | Europe | Other
#   country    the specific country, kept alongside the four-way ecosystem
#   type       the family's primary role in the AI stack:
#                model_developer      frontier labs and model families
#                cloud_infrastructure hyperscale compute and platform services
#                semiconductor        accelerators, fabs, IP cores
#                enterprise_software  applied AI inside business software
#              The first three form the AI technology stack; enterprise
#              software is carried separately and never silently pooled with
#              them.
#   ticker     the issuer's own ticker when the family is itself an S&P 500
#              filer, so a firm naming its own products can be flagged as a
#              self-reference rather than counted as external ecosystem reach
#
# Ecosystem assignment: the headquarters of the entity that develops and
# operates the technology. Two conventions are worth stating because they are
# not mechanical. A wholly integrated subsidiary that ships under its parent's
# brand takes the parent's ecosystem (Google DeepMind -> United States,
# despite London operations). A listed company with its own operating
# headquarters keeps that headquarters even under foreign majority ownership
# (Arm -> Europe, despite SoftBank control).
#
# Product names are kept in their historical form, so that a 2023 paragraph
# saying "Bard" and a 2025 paragraph saying "Gemini" both resolve to Google
# without either denomination being erased.

# Generic vocabulary that names no ecosystem. Never attributed, and also
# excluded as context evidence for the ambiguous terms below.
generic_exclusions:
  - "artificial intelligence"
  - "ai"
  - "generative ai"
  - "genai"
  - "gen ai"
  - "agentic ai"
  - "edge ai"
  - "large language model"
  - "large language models"
  - "llm"
  - "llms"
  - "foundation model"
  - "foundation models"
  - "transformer"
  - "gpt"                   # architecture name and third-party product suffix
  - "machine learning"
  - "deep learning"
  - "neural network"
  - "computer vision"
  - "nlp"
  - "cloud"
  - "hyperscalers"
  - "gpu"
  - "gpus"
  - "tpu"
  - "tpus"
  - "graphics processing units"
  - "open source"
  - "open-source"
  - "open weights"
  - "third parties"
  - "third-party providers"
  - "technology providers"
  - "technology partners"

# Terms that are ordinary words, personal names or multi-vendor products.
# Each is counted only when one of its context terms appears in the SAME
# paragraph; otherwise the match is discarded.
context_required:
  copilot:            ["microsoft", "github", "azure", "microsoft 365", "m365", "dynamics 365", "windows"]
  gemini:             ["google", "alphabet", "deepmind", "vertex", "bard", "workspace", "android"]
  bard:               ["google", "alphabet"]
  gemma:              ["google", "alphabet", "deepmind"]
  titan:              ["amazon", "aws", "bedrock"]
  nova:               ["amazon", "aws", "bedrock"]
  granite:            ["ibm", "watson", "watsonx"]
  watson:             ["ibm"]
  ernie:              ["baidu"]
  claude:             ["anthropic", "bedrock", "sonnet", "opus", "haiku"]
  llama:              ["meta", "open-weight", "open weight", "open-source", "open source", "fine-tune", "fine-tuned"]
  mistral:            ["mistral ai", "mixtral", "codestral", "pixtral", "le chat", "open-weight", "open weight", "model", "models"]
  cohere:             ["command r", "command r+", "aya", "embed", "rerank", "model", "models"]
  kimi:               ["moonshot", "model", "models"]
  jamba:              ["ai21", "model", "models"]
  einstein:           ["salesforce", "agentforce", "sales cloud", "service cloud"]
  firefly:            ["adobe"]
  foundry:            ["palantir", "azure", "gotham", "aip"]
  aip:                ["palantir", "foundry"]
  sensei:             ["adobe"]
  joule:              ["sap"]
  now assist:         ["servicenow"]
  cortex:             ["snowflake"]
  grok:               ["xai", "x.ai", "musk"]
  arm:                ["arm holdings", "arm-based", "arm architecture", "arm processor", "arm cpu", "arm core", "arm ecosystem"]

