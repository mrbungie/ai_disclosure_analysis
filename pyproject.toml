[project]
name = "mib-tesis-ai-disclosure"
version = "0.1.0"
description = "SEC Corporate AI Disclosure NLP Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "markdownify>=0.11.0",
    "python-dotenv>=1.0.0",
    "yfinance>=1.7.0",
    "pyyaml>=6.0.2",   # 6.0.3 was an arbitrary floor; paddleocr (pdf-vlm) pins ==6.0.2
    "edgartools>=5.55.0",
    "sf-hamilton>=1.89.0",
    "duckdb>=1.5.5",
    "pymupdf>=1.28.2",
    "sentence-transformers>=6.0.1",
    "xlrd>=2.0.2",
    "pydantic-ai>=2.38.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
# Operación de la máquina, no del pipeline de datos. `vastai` lo usa
# scripts/common/finish_and_stop.sh para apagar la instancia cuando la
# corrida termina; el script cae a curl si no está, así que su ausencia
# degrada pero no rompe.
ops = [
    "vastai>=1.6",
]
# GPU document-parsing backends for scripts/common/pdf/backends/. Optional
# and NOT in the default install: they pull torch/paddle and multi-GB model
# weights, and the pymupdf backend (which is in the base dependencies) runs
# the whole Chilean pipeline without them. See
# docs/analytics/pdf-backend-poc.md for which one to install and why.
#
# paddlepaddle-gpu is deliberately absent: its wheel must match the CUDA
# arch of the card in the machine and is not on PyPI. On the RTX 5090
# (Blackwell, sm_120) that is the cu129 build, NOT the cu126 one the model
# card suggests:
#   uv pip install paddlepaddle-gpu==3.3.1 \
#     --index-url https://www.paddlepaddle.org.cn/packages/stable/cu129/
pdf-vlm = [
    "paddleocr[doc-parser]>=3.6.0",
    "opencv-python-headless>=4.10",   # opencv-python needs libGL; headless doesn't
]

[tool.pytest.ini_options]
pythonpath = [".", "scripts/01_10k", "scripts/03_market_data", "scripts/common"]
