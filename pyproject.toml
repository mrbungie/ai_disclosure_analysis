[project]
name = "mib-tesis-ai-disclosure"
version = "0.1.0"
description = "SEC Corporate AI Disclosure NLP Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "markdownify>=0.11.0",
    "python-dotenv>=1.0.0",
    "yfinance>=1.7.0",
    "pyyaml>=6.0.2",
    "edgartools>=5.55.0",
    "sf-hamilton>=1.89.0",
    "pymupdf>=1.28.2",
    "sentence-transformers>=6.0.1",
    "xlrd>=2.0.2",
    "pydantic-ai>=2.38.0",
    "dspy-ai>=3.3.1",
    "polars>=1.44.2",
    "duckdb>=1.5.5",
    "gradio>=6.27.0",
    "plotly>=7.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "python-docx>=1.2.0",
]
# Operación de la máquina, no del pipeline de datos. `vastai` lo usa
# scripts/common/finish_and_stop.sh para apagar la instancia cuando la
# corrida termina; el script cae a curl si no está, así que su ausencia
# degrada pero no rompe.
ops = [
    "vastai>=1.6",
]
# What Quarto's executable Python chunks in thesis_document/thesis.qmd need
# beyond the base pipeline dependencies above. render.py itself is a
# self-contained `uv run --script` with its own inline deps (python-docx,
# docxcompose) — this group is for QUARTO_PYTHON (.venv), which is what
# actually executes the chunks.
thesis = [
    "matplotlib>=3.5",
    "tabulate>=0.10",
    "ipython>=8.0",
    "statsmodels>=0.14",
    "scipy>=1.11",
    "archetypes>=0.12.2",
    "jupyter>=1.0",   # Quarto's notebook engine needs a Jupyter kernel to execute thesis.qmd's Python chunks
]

[tool.pytest.ini_options]
pythonpath = [".", "scripts/raw_processing/us", "scripts/raw_ingestion/market", "scripts/common"]
