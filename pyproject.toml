[project]
name = "mib-tesis-ai-disclosure"
version = "0.1.0"
description = "SEC Corporate AI Disclosure NLP Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "markdownify>=0.11.0",
    "pydantic>=2.5.0",
    "pydantic-ai>=0.0.18",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = [".", "scripts"]
