[project]
name = "mib-tesis-ai-disclosure"
version = "0.1.0"
description = "SEC Corporate AI Disclosure NLP Pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",
    "markdownify>=0.11.0",
    "python-dotenv>=1.0.0",
    "yfinance>=1.7.0",
    "pyyaml>=6.0.3",
    "edgartools>=5.55.0",
    "sf-hamilton>=1.89.0",
    "duckdb>=1.5.5",
    "pymupdf>=1.28.2",
    "sentence-transformers>=6.0.1",
    "xlrd>=2.0.2",
    "pydantic-ai>=2.38.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
pythonpath = [".", "scripts/01_10k", "scripts/03_market_data", "scripts/common"]
